name: MessageBlocker
options:
  bundleIdPrefix: com.soraycengiz
  deploymentTarget:
    iOS: "17.0"
targets:
  MessageBlocker:
    type: application
    platform: iOS
    sources:
      - path: MessageBlocker
      - path: Shared
    info:
      path: MessageBlocker/Info.plist
      properties:
        CFBundleDisplayName: MessageBlocker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: MessageBlocker/MessageBlocker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.soraycengiz.MessageBlocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soraycengiz.MessageBlocker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TTD73R4725
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MessageFilterExtension
        embed: true
  MessageFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MessageFilterExtension
      - path: Shared
    info:
      path: MessageFilterExtension/Info.plist
      properties:
        CFBundleDisplayName: MessageFilterExtension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
    entitlements:
      path: MessageFilterExtension/MessageFilterExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.soraycengiz.MessageBlocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soraycengiz.MessageBlocker.MessageFilterExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TTD73R4725
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: "YES"
schemes:
  MessageBlocker:
    build:
      targets:
        MessageBlocker: all
        MessageFilterExtension: [build]
    run:
      config: Debug
    archive:
      config: Release
